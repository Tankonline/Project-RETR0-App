name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Restore Firebase configuration
      env:
        FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
      shell: bash
      run: |
        test -n "${FIREBASE_GOOGLE_SERVICES_JSON_BASE64}"
        printf '%s' "${FIREBASE_GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
        test -s app/google-services.json

    - name: Build with Gradle
      run: ./gradlew :app:assembleDebug

    - name: Run unit tests
      run: ./gradlew :app:testDebugUnitTest

    - name: Run Android Lint
      run: ./gradlew :app:lintDebug

    - name: Remove generated Firebase configuration
      if: always()
      shell: bash
      run: rm -f app/google-services.json
