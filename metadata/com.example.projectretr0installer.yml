AutoName: Project RETR0 installer
Summary: User-authorized installer and community tools for supported RR3 packages
Description: |-
    Project RETR0 installer provides user-initiated RR3 asset installation,
    backup/revert support, and Community Hub features. Privileged file
    operations require the user to configure and grant Shizuku access.

    The app does not self-update. App updates are distributed through the
    selected repository. Music is downloaded or converted externally and
    imported from local device storage through the Android file picker.

